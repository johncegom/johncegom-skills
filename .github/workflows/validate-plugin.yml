name: Validate marketplace and plugin manifests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.286

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate every plugin
        run: |
          fail=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Validating $manifest"
            claude plugin validate "$manifest" || fail=1
          done
          exit $fail

  # Python and jq only (both preinstalled on the runner), so no Node or CLI
  # install. Runs in parallel with `validate`.
  content-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check description length limits (max 500 chars)
        run: |
          fail=0
          check_len() {
            local label="$1" desc="$2"
            len=$(printf '%s' "$desc" | wc -m)
            if [ "$len" -gt 500 ]; then
              echo "::error::$label description is $len chars, exceeds the 500-char marketplace limit"
              fail=1
            fi
          }

          check_len "marketplace.json" "$(jq -r '.description' .claude-plugin/marketplace.json)"

          while IFS=$'\t' read -r name desc; do
            check_len "marketplace.json plugin '$name'" "$desc"
          done < <(jq -r '.plugins[] | [.name, .description] | @tsv' .claude-plugin/marketplace.json)

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            check_len "$manifest" "$(jq -r '.description' "$manifest")"
          done

          exit $fail

      - name: Check SKILL.md frontmatter (Agent Skills spec) and body length (under 500 lines)
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/check_skill_frontmatter.py

      # Warning-only for now: findings show as annotations but do not fail the
      # job. Add --strict once the false-positive rate is known to be low.
      - name: Scan plugin content for risky patterns
        run: python3 .github/scripts/check_skill_safety.py
