name: Validate marketplace and plugin manifests

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate every plugin
        run: |
          fail=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Validating $manifest"
            claude plugin validate "$manifest" || fail=1
          done
          exit $fail

      - name: Check description length limits (max 500 chars)
        run: |
          fail=0
          check_len() {
            local label="$1" desc="$2"
            len=$(printf '%s' "$desc" | wc -m)
            if [ "$len" -gt 500 ]; then
              echo "::error::$label description is $len chars, exceeds the 500-char marketplace limit"
              fail=1
            fi
          }

          check_len "marketplace.json" "$(jq -r '.description' .claude-plugin/marketplace.json)"

          while IFS=$'\t' read -r name desc; do
            check_len "marketplace.json plugin '$name'" "$desc"
          done < <(jq -r '.plugins[] | [.name, .description] | @tsv' .claude-plugin/marketplace.json)

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            check_len "$manifest" "$(jq -r '.description' "$manifest")"
          done

          exit $fail

      - name: Check SKILL.md size budget (max 20000 bytes)
        run: |
          fail=0
          for skill in plugins/*/skills/*/SKILL.md; do
            size=$(wc -c < "$skill")
            if [ "$size" -gt 20000 ]; then
              echo "::error file=$skill::$skill is $size bytes, exceeds the 20000-byte context budget for this repo (not a documented harness limit). Move cold-path detail into references/."
              fail=1
            elif [ "$size" -ge 18000 ]; then
              echo "::warning file=$skill::$skill is $size bytes, within 2000 of the 20000-byte budget."
            fi
          done
          exit $fail

      - name: Check SKILL.md frontmatter against the Agent Skills spec
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/check_skill_frontmatter.py
